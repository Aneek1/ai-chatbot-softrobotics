name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The default test run needs no model file: every test that loads one is marked slow, and
# pytest's addopts leave slow tests out.
jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.6"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle

  image:
    name: Image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v5
      # Each architecture is built on a runner of that architecture, so nothing runs under emulation
      # and no image leaves the runner.
      - run: docker build --tag softrobotics-assistant:ci .
      - run: docker run --rm softrobotics-assistant:ci python -c "import backend.app.main"

  coreml:
    name: Core ML conversion (Apple silicon)
    # macos-latest is Apple silicon, so the conversion and its check run on the architecture the
    # model is meant for rather than under emulation. Free for public repositories.
    runs-on: macos-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.6"
          python-version: "3.12"
          enable-cache: true
      # torch comes from the train group: coremltools removed ONNX conversion in 6.x, so the
      # head is rebuilt as the PyTorch module it was trained as and converted from there.
      - run: uv sync --frozen --group train
      - run: uv pip install coremltools
      # Converts the committed 799 KB head and checks it against results/lid-head-reference.json,
      # which was generated from the ONNX model on the machine that trained it. The script exits
      # non-zero if any predicted label changed, because a model that answers differently no
      # longer has the accuracy that was measured for it.
      - run: uv run --group train python scripts/coreml_export.py
      - uses: actions/upload-artifact@v4
        with:
          name: lid-specialist-e5-head-coreml
          path: models/lid-specialist-e5-head.mlpackage
          if-no-files-found: error
