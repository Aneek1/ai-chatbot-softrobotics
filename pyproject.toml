[project]
name = "softrobotics-assistant"
version = "0.1.0"
description = "Multilingual retrieval assistant for soft-robotics fabrication, with language identification"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.53",
    "pydantic-settings>=2.15",
    "httpx>=0.28",
    "fasttext-predict>=0.9.2.4",
    "fastembed>=0.8",
    "tokenizers>=0.23",
    "qdrant-client>=1.19",
    "opencc>=1.4.2",
    "google-genai>=2.23",
    "huggingface-hub>=1.31",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = ["slow: needs downloaded model files or a running Ollama"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
